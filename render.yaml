services:
  - type: worker
    name: exitant-kiwoom-infinite
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    image:
      url: docker.io/exitant/exitant-kiwoom-infinite:latest
    envVars:
      - key: KIWOOM_APP_KEY
        sync: false
      - key: KIWOOM_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
